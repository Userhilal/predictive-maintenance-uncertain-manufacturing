name: Check SCANIA source-only preprocessing scripts

on:
  pull_request:
    paths:
      - "src/preprocessing/audit_scania_horizon48.py"
      - "src/preprocessing/build_scania_training_manifest.py"
      - "src/preprocessing/profile_scania_trainfit_sensors.py"
      - "src/preprocessing/review_scania_sensor_profile.py"
      - "src/preprocessing/create_scania_model_input_contract.py"
      - "src/preprocessing/audit_stage1_collection.py"
      - "src/preprocessing/audit_stage2_quality.py"
      - "src/preprocessing/review_stage2_report.py"
      - "src/preprocessing/clean_stage3_originals.py"
      - "src/preprocessing/prepare_ai4i.py"
      - "src/preprocessing/prepare_fault_images.py"
      - "src/preprocessing/audit_scania_cutoffs.py"
      - "src/preprocessing/prepare_scania.py"
      - ".github/workflows/scania-source-only-syntax.yml"

permissions:
  contents: read

jobs:
  python-syntax-no-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile source-only scripts (no downloads, no generated data)
        run: python -m py_compile src/preprocessing/prepare_scania.py src/preprocessing/audit_scania_cutoffs.py src/preprocessing/audit_scania_horizon48.py src/preprocessing/build_scania_training_manifest.py src/preprocessing/profile_scania_trainfit_sensors.py src/preprocessing/review_scania_sensor_profile.py src/preprocessing/create_scania_model_input_contract.py src/preprocessing/audit_stage1_collection.py src/preprocessing/audit_stage2_quality.py src/preprocessing/review_stage2_report.py src/preprocessing/clean_stage3_originals.py src/preprocessing/prepare_ai4i.py src/preprocessing/prepare_fault_images.py
